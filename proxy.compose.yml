# The proxy's services, included by docker-compose.yml with .env.prod loaded (that
# is where ${CALLCENTER_NGINX} and ${FORECAST_NGINX} come from). Run `docker compose`
# as usual, which reads docker-compose.yml, not with -f on this file.
services:
  # Port 80: Let's Encrypt's HTTP challenge (files written by certbot) and the
  # redirect to HTTPS.
  nginx-http:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    restart: unless-stopped
    volumes:
      - ./nginx/http/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot:/var/www/certbot:ro

  # Port 443: TLS, then each app. Needs the certificates from `certbot`.
  nginx-https:
    image: nginx:1.27-alpine
    ports: ["443:443"]
    restart: unless-stopped
    volumes:
      - ./nginx/render-modules.sh:/docker-entrypoint.d/40-render-modules.sh:ro
      - ${CALLCENTER_NGINX}/prod/https/nginx.conf:/modules/callcenter/nginx.conf:ro
      - ${CALLCENTER_NGINX}/.env.prod:/modules/callcenter/.env.prod:ro
      - ${FORECAST_NGINX}/prod/https/nginx.conf:/modules/forecast/nginx.conf:ro
      - ${FORECAST_NGINX}/.env.prod:/modules/forecast/.env.prod:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on: [nginx-http]
    networks: [default, edge]
    # Reloads every 6h so renewed certificates (see certbot-renew) are picked up. The
    # image's entrypoint is called by hand: it is what runs render-modules.sh.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"'

  # One-shot: for each app, obtains (or expands to include www) the certificate for
  # BASE_DOMAIN in its .env.prod, stored under letsencrypt/live/<BASE_DOMAIN>/. Exits.
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./certbot:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
      - ${CALLCENTER_NGINX}/.env.prod:/modules/callcenter/.env.prod:ro
      - ${FORECAST_NGINX}/.env.prod:/modules/forecast/.env.prod:ro
    depends_on: [nginx-http]
    entrypoint: /bin/sh -c 'for f in /modules/*/.env.prod; do (set -a; . $$f; certbot certonly --non-interactive --agree-tos --keep-until-expiring --expand -m $$ADMIN_EMAIL --webroot -w /var/www/certbot --cert-name $$BASE_DOMAIN -d $$BASE_DOMAIN -d www.$$BASE_DOMAIN) || exit 1; done'

  # Long-running: renews the certificates every 12h (certbot no-ops until one is
  # within 30 days of expiry); nginx-https reloads on its own 6h loop.
  certbot-renew:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - ./certbot:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
    depends_on: [nginx-https]
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

networks:
  edge:
    external: true
