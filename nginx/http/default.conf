# Port 80 for every domain (docker-compose.yml, service `nginx-http`).
# Answers Let's Encrypt's HTTP challenge for certbot and sends everything else to
# HTTPS. Not tied to a domain, so a new app needs no change here.

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
